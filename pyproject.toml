[project]
name = "caravelmetrics"
version = "0.1.0"
description = "Automated framework for large-scale graph-based cerebrovascular analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-image>=0.19.0",
    "scikit-learn>=1.0.0",
    "networkx>=2.6.0",
    "nibabel>=3.2.0",
    "pandas>=1.3.0",
    "nipype>=1.8.0",
    "vedo==2023.4.6",
    "SimpleITK>=2.2.0",
    "tqdm>=4.65.0",
]

[tool.uv]
package = false
